  <text x="80" y="172" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#8b9cad">How one dependency-free Node process replaced four mock containers — and turned the foot…</text>

  <g>
    <text x="80" y="232" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c8d6e2" xml:space="preserve">  test process                      one process, 50 MB<tspan fill="#4d5b6b"></tspan></text>
    <text x="80" y="254" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c8d6e2" xml:space="preserve"> ┌──────────────┐                 ┌──────────────────────┐<tspan fill="#4d5b6b"></tspan></text>
    <text x="80" y="276" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c8d6e2" xml:space="preserve"> │ startMock()  │                 │  Node http server    │<tspan fill="#4d5b6b"></tspan></text>
    <text x="80" y="298" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c8d6e2" xml:space="preserve"> │              │────────────────▶│  no dependencies     │<tspan fill="#4d5b6b"></tspan></text>
    <text x="80" y="320" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c8d6e2" xml:space="preserve"> │  no ports    │                 │                      │<tspan fill="#4d5b6b"></tspan></text>
    <text x="80" y="342" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c8d6e2" xml:space="preserve"> │  no cleanup  │                 │  /stripe  /paystack  │<tspan fill="#4d5b6b"></tspan></text>
    <text x="80" y="364" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c8d6e2" xml:space="preserve"> └──────────────┘                 │  /interswitch        │<tspan fill="#4d5b6b"></tspan></text>
    <text x="80" y="386" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c8d6e2" xml:space="preserve">     │                          │  /flutterwave        │<tspan fill="#4d5b6b"></tspan></text>
    <text x="80" y="408" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c8d6e2" xml:space="preserve">     │ nothing to stop          │  /monnify            │<tspan fill="#4d5b6b"></tspan></text>
